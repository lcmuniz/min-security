spring.application.name=min-security

# JWT signing key: Base64, at least 32 bytes. Generate one with: openssl rand -base64 32
# Left empty, a random key is generated at startup (tokens are lost on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=min-security
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=1d

# Demo users (admin has ADMIN+USER, user has USER). The defaults are for local use only;
# set DEMO_ADMIN_PASSWORD / DEMO_USER_PASSWORD anywhere else.
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:admin}
app.demo.user-password=${DEMO_USER_PASSWORD:user}
